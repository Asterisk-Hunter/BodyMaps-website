server {
    listen 80;
    server_name bodymaps.wse.jhu.edu;

    # JSON/control routes stay small. Large bodies are allowed only on upload paths.
    client_max_body_size 2M;

    # Serve the built React SPA
    root /home/visitor/PanTS-Viewer/PanTS-Demo/dist;
    index index.html;

    # SharedArrayBuffer headers required by Cornerstone/NiiVue
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy cross-origin always;
    add_header Referrer-Policy no-referrer always;

    # Dataset routes are authorized by Flask, then handed back to nginx with an
    # X-Accel-Redirect. These locations are internal, so no public request can
    # bypass Flask's case-id validation. Nginx can stream a large immutable
    # NIfTI with sendfile without occupying a Gunicorn worker thread.
    # Keep each alias synchronized with flask-server/.env on this host.
    location ^~ /_bodymaps_volume_lowres/ {
        internal;
        alias /home/visitor/pants_lowres/;
    }

    location ^~ /_bodymaps_volume_pants/ {
        internal;
        alias /mnt/bodymaps/zzhou82/data/PanTS/;
    }

    location ^~ /_bodymaps_volume_cancerverse_lowres/ {
        internal;
        alias /home/visitor/cancerverse_lowres/;
    }

    location ^~ /_bodymaps_volume_cancerverse/ {
        internal;
        alias /mnt/bodymaps/zzhou82/data/CancerVerse/;
    }

    # Updated CancerVerse scans staged by scripts/stage_cancerverse_update.sh
    # (CANCERVERSE_OVERLAY_PATH). Harmless until that variable is set.
    location ^~ /_bodymaps_volume_cancerverse_overlay/ {
        internal;
        alias /home/visitor/cancerverse_v351/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the gunicorn backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts: inference can take 10-30 minutes
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_connect_timeout 60;
    }

    # Profile photos accept 5 MiB plus multipart framing. Keep this narrowly
    # scoped; ordinary JSON/control routes retain the 2M server limit.
    location = /api/auth/avatar {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6M;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
        proxy_connect_timeout 60;
    }

    location ~ ^/api/(upload|upload-inference-chunk|upload-dicom-slice|jobs/[^/]+/result|save-edited-mask/) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1024M;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_connect_timeout 60;
    }

    # Keep long-lived collaboration sockets outside Gunicorn request threads.
    location /ws/live-rooms/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
